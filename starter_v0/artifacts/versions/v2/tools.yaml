tools:
  - name: clarify
    description: "Ask the user for one missing value needed to continue, such as a Twitter/X handle, a URL, or yes/no confirmation for a write action. Use this instead of guessing."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Clear question for the user."}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Use text for missing handle/URL, yes_no for send/publish confirmation, choice for explicit options."}
        options: {type: array, default: [], items: {type: string}, description: "Choices when response_type is choice."}
      required: [question]
  - name: timeline
    description: "Fetch recent tweets/posts from one specific Twitter/X account. Use only when the user names a person/account or provides a handle. screenname must not include @. Known mappings: Sam Altman=sama, Elon Musk=elonmusk, Andrej Karpathy=karpathy."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Account handle without @."}
        limit: {type: integer, default: 5, description: "Number of posts requested; preserve explicit user limits."}
      required: [screenname]
  - name: social_search
    description: "Search Twitter/X by topic or keyword. Use for what people are discussing about a subject, not for one account timeline. Use search_type=Top for popular/top, Latest for newest/latest."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Topic or keyword to search."}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Top for popular/top; Latest for newest/latest."}
        limit: {type: integer, default: 5, description: "Number of posts requested."}
      required: [query]
  - name: lookup
    description: "Search the public web through Tavily. Use for current news, broad web discovery, or public facts when no specific URL is provided. For news use topic=news. Map today/hom nay to day, this week/tuan nay to week, this month/thang nay to month."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Search query."}
        topic: {type: string, enum: [general, news], default: "general", description: "Use news for current news requests."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "day=today, week=this week, month=this month, year=this year."}
        max_results: {type: integer, default: 5, description: "Small result count unless user asks otherwise."}
      required: [query]
  - name: fetch
    description: "Read one specific URL supplied by the user. Use instead of lookup when the request includes an exact link. If the user says this article/page without a URL, use clarify."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Exact URL to read."}
      required: [url]
  - name: format
    description: "Format already collected items into markdown. This tool does not search, fetch, or verify data. Only use after source tools have returned items or the user supplied structured items."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Existing items to format; do not invent them."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Output template."}
        headline: {type: string, default: "", description: "Optional headline."}
      required: [items, template]
  - name: send
    description: "Send text to Telegram. This is an external write action. Use only when the user has explicitly confirmed the exact send/post action in the current conversation. Otherwise call clarify with response_type=yes_no."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Text to send."}
        confirmed: {type: boolean, default: false, description: "Must be true only after explicit confirmation."}
      required: [text]
  - name: policy
    description: "Search local company policy documents. Use for internal rules about source citation, data privacy, publishing, tool usage, and research workflow."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Policy question."}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Choose the narrowest policy area."}
        top_k: {type: integer, default: 3, description: "Number of policy sections."}
      required: [query]
  - name: papers
    description: "Search arXiv for papers/preprints by topic. Use for paper discovery, recent research, or academic literature search. Do not use to read a specific arXiv ID; use paper_text for that."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Paper search query."}
        max_results: {type: integer, default: 5, description: "Number of papers."}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Use submittedDate/lastUpdatedDate for new/recent papers."}
      required: [query]
  - name: paper_text
    description: "Download and extract text from a specific arXiv paper when the user provides an arXiv ID or URL and asks to read/summarize content."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "arXiv ID or URL, e.g. 1706.03762."}
        max_pages: {type: integer, default: 5, description: "Number of PDF pages to extract."}
        max_chars: {type: integer, default: 8000, description: "Maximum extracted text characters."}
      required: [arxiv_url]

